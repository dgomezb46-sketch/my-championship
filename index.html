function qualifyStandings(gpId,session){return sortedQual(gpId,session).map((r,i)=>({...r,position:i+1}))}
function calcStandings(type){let list=type==='wdc'?db.drivers:db.teams;let a={};list.forEach(x=>a[x.id]={id:x.id,name:x.name,team:x.teamId,points:0,wins:0});db.results.forEach(r=>{if(!isRace(r.session))return;let id=type==='wdc'?r.driverId:r.teamId;if(type==='wdc'&&r.eligibleWdc===false)return;if(a[id]){a[id].points+=pts(r);if(Number(r.position)===1&&r.status!=='DNS'&&r.status!=='DSQ')a[id].wins++}});return Object.values(a).sort((x,y)=>y.points-x.points||y.wins-x.wins||x.name.localeCompare(y.name))}
function driverStats(){return db.drivers.map(d=>{let rr=db.results.filter(r=>r.driverId===d.id&&isRace(r.session));let wins=rr.filter(r=>Number(r.position)===1&&r.status!=='DNS'&&r.status!=='DSQ').length,podiums=rr.filter(r=>Number(r.position)>=1&&Number(r.position)<=3&&r.status!=='DNS'&&r.status!=='DSQ').length,poles=db.results.filter(r=>r.driverId===d.id&&['q3','qualifying'].includes(r.session)&&qualifyStandings(r.gpId,r.session)[0]?.driverId===d.id).length,fastestLaps=rr.filter(r=>r.fastestLap===true).length;let finishes=rr.filter(r=>Number(r.position)>0&&r.status!=='DNS'&&r.status!=='DSQ').map(r=>Number(r.position));let points=rr.reduce((s,r)=>s+(r.eligibleWdc===false?0:pts(r)),0);return {...d,wins,podiums,poles,fastestLaps,points,best:finishes.length?'P'+Math.min(...finishes):'—',dnf:rr.filter(r=>r.status==='DNF').length}}).sort((a,b)=>b.points-a.points||b.wins-a.wins)}
function nav(){let items=mode==='admin'?[['PRINCIPAL',[['dashboard','⌂','Inicio']]],['CAMPEONATO',[['drivers','♟','Pilotos'],['market','⇄','Mercado'],['teams','▦','Escuderías'],['calendar','▤','Calendario'],['results','▥','Resultados'],['standings','♛','Clasificaciones'],['stats','▤','Estadísticas'],['history','◷','Historial']]],['CONFIGURACIÓN',[['admin','⚙','Administración']]]]:[['CAMPEONATO',[['dashboard','⌂','Inicio'],['standings','♛','Clasificaciones'],['results','▥','Resultados'],['calendar','▤','Calendario'],['drivers','♟','Pilotos'],['teams','▦','Escuderías'],['stats','▤','Estadísticas'],['history','◷','Historial']]]];$('navigation').innerHTML=items.map(group=>`<div class="navgroup"><div class="navlabel">${group[0]}</div>${group[1].map(x=>`<button class="navbtn ${currentPage===x[0]?'active':''}" data-page="${x[0]}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}</div>`).join('')}

function table(headers,rows,empty='Todavía no hay registros.'){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`}

function dashboard(el){let w=calcStandings('wdc'),c=calcStandings('wcc'),last=[...db.results].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];el.innerHTML=`${banner()}<div class="grid">${statCard('PILOTOS',db.drivers.length,'En parrilla')}${statCard('ESCUDERÍAS',db.teams.length,'Participantes')}${statCard('GRANDES PREMIOS',db.calendar.length,'En calendario')}${statCard('RESULTADOS',db.results.length,'Registros guardados')}</div><section class="section"><div class="sectionhead"><h2>🏆 Campeonato de pilotos</h2><button class="secondary tiny" onclick="go('standings')">Ver WDC</button></div>${table(['Pos.','Piloto','Escudería','Puntos'],w.slice(0,5).map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${driverCell(x.id)}</td><td>${esc(tname(x.team))}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><div class="sectionhead"><h2>🏗️ Campeonato de constructores</h2><button class="secondary tiny" onclick="go('standings')">Ver WCC</button></div>${table(['Pos.','Escudería','Puntos'],c.slice(0,5).map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${teamCell(x.id)}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><div class="sectionhead"><h2>Último registro</h2><button class="secondary tiny" onclick="go('results')">Ver resultados</button></div><div class="card">${last?`<b>${esc(gpname(last.gpId))} · ${sessionLabel(last.session)}</b><p class="muted">${esc(dname(last.driverId))} · ${last.time?esc(last.time):'P'+(last.position||'—')}</p>`:'Todavía no hay sesiones registradas. ¡A estrenar el campeonato! 🏁'}</div></section>`}
function driverCell(id){let d=db.drivers.find(x=>x.id===id);return `<span class="drivercell"><span class="flag">${esc(d?.flag||'🏁')}</span><b>${esc(d?.name||dname(id))}</b></span>`}function teamCell(id){let t=db.teams.find(x=>x.id===id);return `<span class="teamcell">${t?.logo?`<img class="logoimg" src="${t.logo}">`:`<span class="teamdot" style="background:${esc(t?.color||'#e63946')}"></span>`}<b>${esc(t?.name||tname(id))}</b></span>`}
function drivers(el){let rows=db.drivers.map(d=>`<tr><td>${driverCell(d.id)}</td><td>${teamCell(d.teamId)}</td><td>${esc(d.number||'—')}</td><td><span class="tag ${(d.role||'titular')==='titular'?'green':(d.role||'')==='reserva-activo'?'':'red'}">${({titular:'Titular','reserva-activo':'Reserva activo','reserva-inactivo':'Reserva inactivo'})[d.role||'titular']}</span></td>${mode==='admin'?`<td><div class="actions"><button class="secondary tiny" onclick="editDriver('${d.id}')">Editar</button><button class="danger tiny" onclick="delDriver('${d.id}')">Eliminar</button></div></td>`:''}</tr>`).join('');el.innerHTML=`<div class="sectionhead"><div><h2>${mode==='admin'?'Parrilla de pilotos':'Pilotos del campeonato'}</h2><p>${db.drivers.length} pilotos registrados</p></div>${mode==='admin'?'<button onclick="addDriver()">+ Añadir piloto</button>':'<span class="publiclock">● Solo lectura</span>'}</div>${table(['Piloto','Escudería','Número','Estado',...(mode==='admin'?['Acciones']:[])],rows)}`}
function market(el){let rows=db.transfers.slice().reverse().map(t=>`<tr><td>${esc(t.driver||'—')}</td><td>${esc(t.from||'—')}</td><td>${esc(t.to||'—')}</td><td>${new Date(t.date).toLocaleDateString('es-DO')}</td></tr>`).join('');el.innerHTML=`<div class="sectionhead"><div><h2>Mercado de pilotos</h2><p>Transferencias e intercambios entre escuderías.</p></div>${mode==='admin'?'<button onclick="openMarket()">＋ Nuevo movimiento</button>':''}</div><div class="notice">Los puntos WDC anteriores al movimiento dejan de contar para ese piloto. Los puntos WCC ya registrados permanecen en la escudería que los consiguió.</div>${table(['Piloto','Escudería anterior','Nueva escudería','Fecha'],rows,'Todavía no hay movimientos.')}`}
function openMarket(){if(db.teams.length<2||!db.drivers.length)return alert('Necesitas pilotos y al menos dos escuderías.');let opts=db.drivers.map(d=>`<option value="${d.id}">${esc(d.name)} · ${esc(tname(d.teamId))}</option>`).join('');let teamOpts=db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');openModal('Movimiento de mercado',`<div class="field"><label>Tipo</label><select id="marketType" onchange="toggleExchange()"><option value="transfer">Transferencia</option><option value="exchange">Intercambio de pilotos</option></select></div><div class="field"><label>Piloto</label><select id="marketDriver">${opts}</select></div><div class="field" id="marketTeamField"><label>Nuevo equipo</label><select id="marketTeam">${teamOpts}</select></div><div id="exchangeFields" class="hidden"><div class="field"><label>Segundo piloto</label><select id="marketDriver2">${opts}</select></div></div>`,()=>{let d=db.drivers.find(x=>x.id===$('marketDriver').value),to=$('marketTeam').value;if(!d)return;if($('marketType').value==='exchange'){let d2=db.drivers.find(x=>x.id===$('marketDriver2').value);if(!d2||d2.id===d.id)return alert('Selecciona dos pilotos distintos.');let teamA=d.teamId,teamB=d2.teamId;if(teamA===teamB)return alert('Los dos pilotos ya pertenecen a la misma escudería.');moveDriver(d,teamB);moveDriver(d2,teamA)}else{if(d.teamId===to)return alert('Ese piloto ya pertenece a esa escudería.');moveDriver(d,to)}closeModal();save()})}
function toggleExchange(){let exchanging=$('marketType').value==='exchange',x=$('exchangeFields'),team=$('marketTeamField');if(x)x.classList.toggle('hidden',!exchanging);if(team)team.classList.toggle('hidden',exchanging)}
function moveDriver(d,newTeam){let old=d.teamId;db.results.filter(r=>r.driverId===d.id&&isRace(r.session)).forEach(r=>{r.eligibleWdc=false});db.transfers.push({id:uid(),driver:d.name,from:tname(old),to:tname(newTeam),date:new Date().toISOString()});d.teamId=newTeam}
function teams(el){let rows=db.teams.map(t=>`<tr><td>${teamCell(t.id)}</td><td>${db.drivers.filter(d=>d.teamId===t.id).map(d=>esc(d.name)).join(', ')||'—'}</td><td>${t.color?`<span class="teamdot" style="background:${esc(t.color)}"></span>${esc(t.color)}`:'—'}</td>${mode==='admin'?`<td><div class="actions"><button class="secondary tiny" onclick="editTeam('${t.id}')">Editar</button><button class="danger tiny" onclick="delTeam('${t.id}')">Eliminar</button></div></td>`:''}</tr>`).join('');el.innerHTML=`<div class="sectionhead"><div><h2>Escuderías</h2><p>${db.teams.length} equipos participantes</p></div>${mode==='admin'?'<button onclick="addTeam()">+ Añadir escudería</button>':'<span class="publiclock">● Solo lectura</span>'}</div>${table(['Escudería','Pilotos actuales','Color',...(mode==='admin'?['Acciones']:[])],rows)}`}
function orderedCalendar(){return [...db.calendar].sort((a,b)=>(Number(a.round)||999)-(Number(b.round)||999)||(a.date||'').localeCompare(b.date||''))}
function calendar(el){let rows=orderedCalendar().map((g,i)=>`<tr><td><b>${g.round?roundLabel(g.round):i+1}</b></td><td><b>${esc(g.name)}</b>${g.date?`<div class="muted">${esc(g.date)}</div>`:''}</td><td>${g.sprint?'<span class="tag green">Sprint</span>':'<span class="tag">Normal</span>'}</td><td>${db.results.some(r=>r.gpId===g.id)?'<span class="tag green">Con resultados</span>':'<span class="tag">Pendiente</span>'}</td><td><div class="actions"><button class="secondary tiny" onclick="openGp('${g.id}')">Ver GP</button>${mode==='admin'?`<button class="secondary tiny" onclick="editGp('${g.id}')">Editar</button><button class="danger tiny" onclick="delGp('${g.id}')">Eliminar</button>`:''}</div></td></tr>`).join('');el.innerHTML=`<div class="sectionhead"><div><h2>Calendario de temporada</h2><p>Los Grandes Premios se ordenan por la ronda que elijas.</p></div>${mode==='admin'?'<button onclick="addGp()">+ Añadir GP</button>':''}</div>${table(['Ronda','Circuito / Gran Premio','Formato','Estado','Acciones'],rows)}`}

function standingsPage(el){let w=calcStandings('wdc'),c=calcStandings('wcc');el.innerHTML=`<section><div class="sectionhead"><h2>🏆 Campeonato de pilotos · WDC</h2></div>${table(['Pos.','Piloto','Escudería actual','Victorias','Puntos'],w.map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${driverCell(x.id)}</td><td>${esc(tname(x.team))}</td><td>${x.wins}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><div class="sectionhead"><h2>🏗️ Campeonato de constructores · WCC</h2></div>${table(['Pos.','Escudería','Victorias','Puntos'],c.map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${teamCell(x.id)}</td><td>${x.wins}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><p class="help">Carrera: 25–18–15–12–10–8–6–4–2–1 · Sprint: 8–7–6–5–4–3–2–1 · Clasificación: 0 puntos · Sin punto por vuelta rápida.</p>`}

function sessionsFor(g){let q=(g.qualifyingMode||'elimination')==='single'?['qualifying']:['q1','q2','q3'];return g.sprint?['sq','sr',...q,'fr']:[...q,'race']}

function results(el){let g=db.calendar.find(x=>x.id===selectedGp);let gps=orderedCalendar();if(selectedGp&&!g)selectedGp='';if(!g){el.innerHTML=`<div class="sectionhead"><div><h2>Resultados por Gran Premio</h2><p>Primero elige el Gran Premio que quieres consultar o editar.</p></div>${mode==='admin'?'<span class="chip">Modo edición</span>':'<span class="publiclock">● Solo lectura</span>'}</div><div class="toolbar"><select id="resultsGpSelect" onchange="selectGp(this.value)"><option value="">Seleccionar Gran Premio…</option>${gps.map(x=>`<option value="${x.id}">${esc(gpDisplay(x))}</option>`).join('')}</select></div><div class="card empty">Selecciona un GP para mostrar únicamente sus sesiones.</div>`;return}
 let groups=resultGroupsFor(g);if(!groups.includes(selectedResultGroup))selectedResultGroup=defaultGroup(g);let isQualGroup=selectedResultGroup==='fq'||selectedResultGroup==='qualifying';if(isQualGroup&&!['q1','q2','q3','qualifying'].includes(selectedSession))selectedSession=(g.qualifyingMode==='single'?'qualifying':'q1');if(g.qualifyingMode==='single'&&isQualGroup)selectedSession='qualifying';if(!isQualGroup)selectedSession=selectedResultGroup;
 let groupOptions=groups.map(x=>`<option value="${x}" ${selectedResultGroup===x?'selected':''}>${esc(groupLabel(g,x))}</option>`).join('');
 el.innerHTML=`<div class="sectionhead"><div><h2>Resultados por Gran Premio</h2><p>Selecciona un GP y después la sesión concreta. Solo verás las sesiones de ese fin de semana.</p></div>${mode==='admin'?'<span class="chip">Modo edición</span>':'<span class="publiclock">● Solo lectura</span>'}</div><div class="selectorstack"><div class="field"><label>Gran Premio</label><select id="resultsGpSelect" onchange="selectGp(this.value)">${gps.map(x=>`<option value="${x.id}" ${selectedGp===x.id?'selected':''}>${esc(gpDisplay(x))}</option>`).join('')}</select></div><div class="field"><label>Sesión</label><select id="resultsSessionSelect" onchange="selectResultGroup(this.value)">${groupOptions}</select></div></div><div class="actions" style="margin:-2px 0 14px"><button class="secondary tiny" onclick="openGp('${g.id}')">Ver página completa del GP ↗</button></div>${isQualGroup&&g.qualifyingMode!=='single'?`<div class="tabs roundtabs">${['q1','q2','q3'].map(x=>`<button class="${selectedSession===x?'active':''}" onclick="selectSession('${x}')">${x.toUpperCase()}</button>`).join('')}</div><div class="chip" style="margin-bottom:10px">${g.sprint?'FQ · Feature Qualifying':'Qualifying'}${selectedSession==='qualifying'?'':' · '+selectedSession.toUpperCase()}</div>`:''}${renderSession(g,selectedSession)}`}
function selectGp(id){selectedGp=id;let g=db.calendar.find(x=>x.id===id);selectedResultGroup=g?defaultGroup(g):'qualifying';selectedSession=g?groupSession(selectedResultGroup):'q1';render()}

function selectSession(s){selectedSession=s;render()}

function sessionTable(gpId,s){let arr=isQual(s)?qualifyStandings(gpId,s):resultsFor(gpId,s).slice().sort((a,b)=>(Number(a.position)||999)-(Number(b.position)||999));let rows=arr.map((r,i)=>{let d=db.drivers.find(x=>x.id===r.driverId);return `<tr><td class="rank">${isQual(s)?i+1:(r.position||'—')}</td><td>${driverCell(r.driverId)}</td><td>${esc(tname(r.teamId||d?.teamId))}</td>${isQual(s)?`<td>${esc(r.time||'—')}</td>`:`<td>${esc(r.status||'FIN')}</td><td>${r.fastestLap?'★ VR':'—'}</td><td class="points">${pts(r)}</td>`}${mode==='admin'?`<td><button class="danger tiny" onclick="deleteEntry('${r.id}')">Borrar</button></td>`:''}</tr>`}).join('');return table(isQual(s)?['Pos.','Piloto','Escudería','Tiempo',...(mode==='admin'?['Acciones']:[])]:['Pos.','Piloto','Escudería','Estado','VR','Pts.',...(mode==='admin'?['Acciones']:[])],rows)}
function renderSession(g,s){let isq=isQual(s),ids=eligibleDrivers(g.id,s);let rows=isq?qualifyStandings(g.id,s):resultsFor(g.id,s).slice().sort((a,b)=>(Number(a.position)||999)-(Number(b.position)||999));let info='';if(s==='q2')info=`Q2 solo permite registrar a los 15 mejores tiempos de Q1. Clasificados disponibles: ${ids.length}.`;if(s==='q3')info=`Q3 solo permite registrar a los 10 mejores tiempos de Q2. Clasificados disponibles: ${ids.length}.`;let out=`<div class="sessionblock"><div class="sessiontitle"><div><h3>${sessionLabel(s)}</h3><small>${isq?'Posiciones calculadas automáticamente por tiempo.':'Posición manual y estado; sin tiempo de carrera ni delta.'}</small></div>${mode==='admin'?`<button onclick="editSession('${g.id}','${s}')">${isq?'Registrar tiempos':'Registrar resultados'}</button>`:''}</div>${info?`<div class="locknote">${info}</div>`:''}${sessionTable(g.id,s)}</div>`;if(mode==='admin'&&isq&&s!=='sq'&&s!=='q1'&&!ids.length)out+=`<p class="help">Registra primero ${s==='q2'?'Q1':'Q2'} para habilitar esta ronda.</p>`;return out}
function openGp(id){currentPage='gp';selectedGp=id;renderGpPage($('content'),id);nav();$('eyebrow').textContent='Detalle del Gran Premio';$('pageTitle').textContent=gpname(id)}

ndary tiny" onclick="editSession('${g.id}','${s}')">Editar sesión</button>`:''}</div>${sessionTable(g.id,s)}</div>`).join('')}</section>`}

function imageData(file,cb,maxW=1100){if(!file){cb('');return}let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=rd.result};rd.readAsDataURL(file)}

function addGp(){let body=`<div class="field"><label>Circuito</label><select id="gpCircuit" onchange="toggleCustomCircuit()">${circuitOptions()}<option value="custom">＋ Añadir circuito personalizado</option></select></div><div id="customCircuitField" class="field hidden"><label>Nombre del circuito y país</label><input id="customCircuitName" type="text" placeholder="Hockenheimring, Alemania 🇩🇪"></div><div class="formgrid"><div class="field"><label>Número de ronda</label><select id="gpRound">${roundOptions(db.calendar.length+1)}</select></div>${fieldHtml('gpDate','Fecha (opcional)')}</div><div class="field"><label>Formato del fin de semana</label><select id="gpSprint"><option value="false">Sin Sprint</option><option value="true">Con Sprint</option></select></div><div class="field"><label>Formato de clasificación</label><select id="gpQualMode"><option value="elimination">Q1 / Q2 / Q3</option><option value="single">Una sola sesión · Qualifying</option></select></div>`;openModal('Añadir Gran Premio',body,()=>{let n=circuitNameFromForm(),round=Number($('gpRound').value);if(!n)return alert('Selecciona un circuito o escribe el nombre del circuito personalizado.');if(db.calendar.some(g=>Number(g.round)===round))return alert(`Ya existe un Gran Premio en la ronda ${roundLabel(round)}.`);let circuitId=$('gpCircuit').value==='custom'?'':$('gpCircuit').value;db.calendar.push({id:uid(),name:n,circuitId,round,date:$('gpDate').value,sprint:$('gpSprint').value==='true',qualifyingMode:$('gpQualMode').value});closeModal();selectedGp=db.calendar[db.calendar.length-1].id;save()})}
function editGp(id){let g=db.calendar.find(x=>x.id===id);if(!g)return;let known=CIRCUITS.find(c=>c.id===g.circuitId)||CIRCUITS.find(c=>c.label===g.name);let circuitId=known?.id||'custom';let body=`<div class="field"><label>Circuito</label><select id="gpCircuit" onchange="toggleCustomCircuit()">${circuitOptions(circuitId)}<option value="custom" ${circuitId==='custom'?'selected':''}>＋ Circuito personalizado</option></select></div><div id="customCircuitField" class="field ${circuitId==='custom'?'':'hidden'}"><label>Nombre del circuito y país</label><input id="customCircuitName" type="text" value="${circuitId==='custom'?esc(g.name):''}" placeholder="Hockenheimring, Alemania 🇩🇪"></div><div class="formgrid"><div class="field"><label>Número de ronda</label><select id="gpRound">${roundOptions(g.round||db.calendar.indexOf(g)+1)}</select></div>${fieldHtml('gpDate','Fecha (opcional)',g.date||'')}</div><div class="field"><label>Formato del fin de semana</label><select id="gpSprint"><option value="false" ${!g.sprint?'selected':''}>Sin Sprint</option><option value="true" ${g.sprint?'selected':''}>Con Sprint</option></select></div><div class="field"><label>Formato de clasificación</label><select id="gpQualMode"><option value="elimination" ${(g.qualifyingMode||'elimination')==='elimination'?'selected':''}>Q1 / Q2 / Q3</option><option value="single" ${g.qualifyingMode==='single'?'selected':''}>Una sola sesión · Qualifying</option></select></div>`;openModal('Editar Gran Premio',body,()=>{let n=circuitNameFromForm(),round=Number($('gpRound').value);if(!n)return alert('Selecciona un circuito o escribe el nombre.');if(db.calendar.some(x=>x.id!==id&&Number(x.round)===round))return alert(`Ya existe otro GP en la ronda ${roundLabel(round)}.`);g.name=n;g.circuitId=$('gpCircuit').value==='custom'?'':$('gpCircuit').value;g.round=round;g.date=$('gpDate').value;g.sprint=$('gpSprint').value==='true';g.qualifyingMode=$('gpQualMode').value;closeModal();save()})}

function pruneQualifiers(gpId,session){if(session==='q1'){let keep2=new Set(eligibleDrivers(gpId,'q2'));db.results=db.results.filter(r=>!(r.gpId===gpId&&r.session==='q2'&&!keep2.has(r.driverId)));}if(session==='q1'||session==='q2'){let keep3=new Set(eligibleDrivers(gpId,'q3'));db.results=db.results.filter(r=>!(r.gpId===gpId&&r.session==='q3'&&!keep3.has(r.driverId)));}}
function formatLapDigits(value){let d=String(value||'').replace(/\D/g,'').slice(0,8);if(!d)return '';d=d.padStart(6,'0');let ms=d.slice(-3),sec=d.slice(-5,-3),min=d.slice(0,-5)||'0';return `${Number(min)}:${sec}.${ms}`}
function attachTimeFormatting(){document.querySelectorAll('.timeinput').forEach(input=>{input.inputMode='numeric';input.placeholder='1:06.589';input.addEventListener('input',()=>{let raw=input.value.replace(/\D/g,'').slice(0,8);input.value=raw?formatLapDigits(raw):'';try{input.setSelectionRange(input.value.length,input.value.length)}catch(e){}})})}
function normalizeOCRText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function rowDriverMatch(line,drivers){let norm=normalizeOCRText(line),candidates=drivers.filter(x=>x.key&&norm.includes(x.key));if(candidates.length===1)return candidates[0];if(candidates.length>1){let team=candidates.find(x=>x.teamKey&&norm.includes(x.teamKey));return team||null}let scored=drivers.map(x=>{let parts=x.key.match(/[a-z]+|\d+/g)||[];let hits=parts.filter(t=>norm.includes(t)).length;return {x,score:parts.length?hits/parts.length:0,team:!!(x.teamKey&&norm.includes(x.teamKey))}}).sort((a,b)=>(b.team-a.team)||(b.score-a.score));if(scored[0]&&((scored[0].team&&scored[0].score>=0.5)||scored[0].score>=0.9)&&(!scored[1]||scored[0].score>scored[1].score||scored[0].team&&!scored[1].team))return scored[0].x;return null}
async function importQualyImage(event,gpId,session){let file=event.target.files&&event.target.files[0];if(!file)return;try{if(!('TextDetector' in window)){alert('Este navegador no ofrece OCR local compatible. La imagen no se envió a ningún servidor y no se guardó nada. Puedes seguir introduciendo los tiempos manualmente.');return}let bitmap=await createImageBitmap(file),detector=new TextDetector(),parts=await detector.detect(bitmap),boxes=parts.map(p=>({text:p.rawValue||'',y:p.boundingBox?p.boundingBox.y:0,h:p.boundingBox?p.boundingBox.height:18})).sort((a,b)=>a.y-b.y),rows=[];for(let box of boxes){let tol=Math.max(10,box.h*.65),last=rows[rows.length-1];if(last&&Math.abs(last.y-box.y)<=tol){last.text+=' '+box.text;last.y=(last.y+box.y)/2}else rows.push({y:box.y,text:box.text})}let roster=db.drivers.map(d=>({id:d.id,key:normalizeOCRText(d.name),teamKey:normalizeOCRText(tname(d.teamId))})),filled=0;for(let row of rows){let match=rowDriverMatch(row.text,roster);if(!match)continue;let rowText=normalizeOCRText(row.text),time=(row.text.match(/\d{1,2}:\d{2}\.\d{2,3}/)||[])[0];if(!time)continue;let input=document.querySelector('.timeinput[data-driver="'+match.id+'"]');if(input){input.value=time.includes('.')&&time.split('.')[1].length===2?time+'0':time;filled++}}bitmap.close();alert(filled?'Se detectaron '+filled+' tiempos mediante las filas asociadas a los nombres de pilotos. La escudería se usa como dato de confirmación cuando aparece. Revisa todo antes de guardar.':'No se pudieron asociar filas con suficiente seguridad. Asegúrate de que nombre, escudería y tiempo sean legibles.')}catch(err){alert('No se pudo leer esta imagen en el navegador. No se guardó ningún dato.')}} 
function editSession(gpId,session){let g=db.calendar.find(x=>x.id===gpId);if(!g)return;let qualifying=isQual(session),ids=eligibleDrivers(gpId,session);if(qualifying&&['q2','q3'].includes(session)&&!ids.length)return alert(`Primero registra los tiempos de ${session==='q2'?'Q1':'Q2'}.`);let existing=resultsFor(gpId,session);let rows=ids.map((id,i)=>{let r=existing.find(x=>x.driverId===id);return qualifying?`<div class="qualrow"><span class="rank">${i+1}</span><b>${esc(dname(id))}</b><input type="text" data-driver="${id}" class="timeinput" placeholder="1:06.589" value="${esc(r?.time||'')}"></div>`:`<div class="raceeditrow"><span class="rank">${i+1}</span><b>${esc(dname(id))}</b><input type="number" min="1" data-driver="${id}" class="posinput" placeholder="Pos." value="${r?.position??''}"><select data-driver="${id}" class="statusinput"><option value="FIN" ${(!r||r.status==='FIN')?'selected':''}>FIN</option><option value="DNF" ${r?.status==='DNF'?'selected':''}>DNF</option><option value="DNS" ${r?.status==='DNS'?'selected':''}>DNS</option><option value="DSQ" ${r?.status==='DSQ'?'selected':''}>DSQ</option></select><label class="vrpick"><input type="radio" name="fastestLap" value="${id}" ${r?.fastestLap?'checked':''}> VR</label></div>`}).join('');let body=`<p class="muted">${esc(g.name)} · ${sessionLabel(session)}</p>${qualifying?`<div class="locknote">Introduce los tiempos. El sistema ordenará automáticamente la tabla del más rápido al más lento. ${session==='q2'?'Solo aparecen los 15 mejores de Q1.':session==='q3'?'Solo aparecen los 10 mejores de Q2.':'Todos los pilotos pueden participar.'}</div><div class="actions"><label class="secondary" style="padding:8px 12px;border-radius:8px;cursor:pointer">📷 Importar desde imagen<input type="file" accept="image/*" class="hidden" onchange="importQualyImage(event,'${gpId}','${session}')"></label><small class="muted">Lee texto de la fila: nombre del piloto, escudería como apoyo y tiempo. No usa colores ni estilo del juego. Revisa antes de guardar.</small></div>`:`<div class="locknote">Introduce únicamente la posición final y el estado. No se registra tiempo de carrera ni delta. Marca la VR correspondiente; no suma puntos.</div>`}<div class="tablewrap">${rows}</div>`;openModal(`Registrar ${sessionLabel(session)}`,body,()=>{let now=new Date().toISOString();if(qualifying){let inputs=[...document.querySelectorAll('.timeinput')];let validIds=inputs.map(x=>x.dataset.driver);db.results=db.results.filter(r=>!(r.gpId===gpId&&r.session===session&&!validIds.includes(r.driverId)));inputs.forEach(input=>{let time=input.value.trim();let old=db.results.find(r=>r.gpId===gpId&&r.session===session&&r.driverId===input.dataset.driver);if(!time){if(old)db.results=db.results.filter(x=>x.id!==old.id);return}if(old){old.time=time;old.date=now}else{let d=db.drivers.find(x=>x.id===input.dataset.driver);db.results.push({id:uid(),gpId,session,driverId:d.id,teamId:d.teamId,time,status:'FIN',date:now,eligibleWdc:true})}});pruneQualifiers(gpId,session)}else{let positions=[...document.querySelectorAll('.posinput')],statuses=[...document.querySelectorAll('.statusinput')],fastestId=document.querySelector('input[name="fastestLap"]:checked')?.value;let ids2=positions.map(x=>x.dataset.driver);db.results=db.results.filter(r=>!(r.gpId===gpId&&r.session===session&&!ids2.includes(r.driverId)));positions.forEach(input=>{let id=input.dataset.driver,pos=Number(input.value)||null,status=statuses.find(x=>x.dataset.driver===id).value,fastestLap=id===fastestId;let old=db.results.find(r=>r.gpId===gpId&&r.session===session&&r.driverId===id);if(!pos&&!old&&status==='FIN'&&!fastestLap)return;if(old){old.position=pos;old.status=status;old.fastestLap=fastestLap;old.date=now}else{let d=db.drivers.find(x=>x.id===id);db.results.push({id:uid(),gpId,session,driverId:id,teamId:d.teamId,position:pos,status,fastestLap,date:now,eligibleWdc:true})}})}closeModal();save()});if(qualifying)attachTimeFormatting()}
function deleteEntry(id){if(confirm('¿Borrar este resultado?')){db.results=db.results.filter(r=>r.id!==id);save()}}
function saveSeasonSettings(){db.season.name=$('seasonName').value.trim()||db.season.name;let f=$('seasonBanner').files[0];imageData(f,data=>{if(f)db.season.banner=data;save()})}function removeBanner(){db.season.banner='';save()}
function renameSeason(){openModal('Renombrar temporada',fieldHtml('newSeasonName','Nombre',db.season.name),()=>{db.season.name=$('newSeasonName').value.trim()||db.season.name;closeModal();save()})}
function resetSeason(){if(confirm('¿Reiniciar campeonato? Se borrarán pilotos, escuderías, calendario, resultados y transferencias de esta temporada. Exporta un backup antes.')){let f=fresh();db.season=f.season;db.drivers=[];db.teams=[];db.calendar=[];db.results=[];db.transfers=[];save()}}
function archiveSeason(){if(!confirm('¿Archivar esta temporada y empezar una nueva vacía?'))return;db.archives.push({id:uid(),season:db.season,drivers:db.drivers,teams:db.teams,calendar:db.calendar,results:db.results,transfers:db.transfers,archivedAt:new Date().toISOString()});let f=fresh();db.season={...f.season,name:'Temporada '+(new Date().getFullYear())};db.drivers=[];db.teams=[];db.calendar=[];db.results=[];db.transfers=[];save()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-championship-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.season||!Array.isArray(x.drivers)||!Array.isArray(x.results))throw Error();if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){db=x;db.season.banner||='';db.calendar||=[];db.teams||=[];db.transfers||=[];db.archives||=[];db.results=db.results.map(r=>r.session?r:{...r,session:r.type==='qualifying'?'q3':r.type==='sprint'?'sr':'race'});save();alert('Backup importado.')}}catch{alert('El archivo no parece ser un backup válido.')}};rd.readAsText(f)}
db.results.forEach(r=>{if(!r.teamId)r.teamId=teamOfDriver(r.driverId);if(!r.status)r.status='FIN';if(r.eligibleWdc===undefined)r.eligibleWdc=true});
// Las antiguas entradas conservan equipo y elegibilidad WDC; normalizamos sesión y estado.
db.drivers.forEach(d=>{if(!d.role)d.role='titular'});db.calendar.forEach(g=>{if(!g.qualifyingMode)g.qualifyingMode='elimination'});
db.results.forEach(r=>{if(!r.teamId)r.teamId=teamOfDriver(r.driverId);if(!r.status)r.status='FIN';if(r.eligibleWdc===undefined)r.eligibleWdc=true});
// Las antiguas entradas conservan equipor.teamId=teamOfDriver(r.driverId);if(!r.status)r.status='FIN';if(r.eligibleWdc===undefined)r.eligibleWdc=true});
$('navigation').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});render();
</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('No se pudo registrar el modo sin conexión:',err)));}</script></body></html>
