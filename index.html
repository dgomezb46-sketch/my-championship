<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><meta name="description" content="Gestiona tus campeonatos de carreras: pilotos, escuderías, resultados y clasificaciones."><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>My Championship</title><style>
:root{--bg:#0b1020;--p:#141e32;--p2:#1b2942;--line:#2b3b58;--tx:#edf2ff;--muted:#9cabc4;--red:#e63946;--green:#48d6a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,Arial}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#080e1b;padding:22px 14px;border-right:1px solid var(--line)}.logo{font-size:21px;font-weight:900;margin:0 8px 24px}.logo span{color:var(--red)}nav{display:grid;gap:5px}nav button{background:none;color:var(--muted);text-align:left}nav button.active,nav button:hover{background:var(--p2);color:white}.side small{display:block;color:var(--muted);margin:35px 8px;font-size:11px}main{padding:28px;max-width:1450px;width:100%;margin:auto}.top,.head,.actions,.event{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}.title{font-size:29px;margin:3px 0 22px}.pill,.tag{background:#263651;padding:5px 9px;border-radius:99px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:linear-gradient(145deg,var(--p),#10192a);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}.stat{font-size:29px;font-weight:850}.muted,.note{color:var(--muted)}.note{font-size:11px}.section{margin-top:22px}.head{margin-bottom:12px}.head h2{font-size:17px;margin:0}.btn,button{border:0;border-radius:9px;padding:9px 13px;background:var(--red);color:white;font-weight:700;cursor:pointer}.btn2{background:#2a3a56}.danger{background:#8e2934}.small{padding:6px 9px;font-size:11px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;min-width:530px;background:#111a2b}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#19263d}tr:last-child td{border:0}.points{color:var(--green);font-weight:800}.empty{text-align:center;padding:25px;color:var(--muted)}input,select,textarea{width:100%;background:#0b1425;color:white;border:1px solid #344561;border-radius:8px;padding:10px;font:inherit}label{display:block;font-size:12px;color:#c0cce0;margin:0 0 6px}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modalbg{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px;z-index:10}.modalbg.show{display:flex}.modal{background:#142039;border:1px solid #40516f;border-radius:15px;padding:22px;width:min(650px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 15px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.notice{background:#30291a;border:1px solid #67552c;color:#f5d98e;padding:12px;border-radius:10px;font-size:12px;margin-top:12px}.rowactions{display:flex;gap:5px}.good{color:var(--green)}@media(max-width:800px){.app{display:block}.side{padding:13px;border-right:0;border-bottom:1px solid var(--line)}.logo{display:inline-block;margin:0 12px 0 3px}.side small{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap;padding:8px 10px}main{padding:19px 13px}.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:25px}}@media(max-width:500px){.grid{gap:8px}.card{padding:12px}.stat{font-size:24px}.formgrid{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">MY <span>CHAMPIONSHIP</span></div><nav id="nav"><button class="active" data-page="dashboard">⌂ Inicio</button><button data-page="drivers">♟ Pilotos</button><button data-page="teams">▦ Escuderías</button><button data-page="results">▤ Resultados</button><button data-page="calendar">▤ Calendario</button><button data-page="standings">♛ Clasificaciones</button><button data-page="history">◷ Historial</button><button data-page="admin">⚙ Administración</button></nav><small>LOCAL EDITION · DATOS EN ESTE DISPOSITIVO</small></aside><main><div class="top"><div><div class="eyebrow" id="eyebrow">Panel de control</div><h1 class="title" id="title">Inicio</h1></div><span class="pill" id="season">Temporada activa</span></div><div id="content"></div></main></div><div class="modalbg" id="modalbg"><div class="modal" id="modal"></div></div>
<script>
const $=id=>document.getElementById(id);const KEY='myChampionship.v1',GP=[25,18,15,12,10,8,6,4,2,1],SPR=[8,7,6,5,4,3,2,1];const uid=()=>Math.random().toString(36).slice(2,11);const fresh=()=>({season:{id:uid(),name:'Temporada 2026'},drivers:[],teams:[],calendar:[],results:[],transfers:[],archives:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}let resultsGp='all',resultsType='race';function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pts(r){if(r.status==='DNS'||r.status==='DSQ')return 0;return r.type==='race'?GP[r.position-1]||0:r.type==='sprint'?SPR[r.position-1]||0:0}function dname(id){return db.drivers.find(x=>x.id===id)?.name||'Piloto eliminado'}function tname(id){return db.teams.find(x=>x.id===id)?.name||'Equipo eliminado'}function gname(id){return db.calendar.find(x=>x.id===id)?.name||'GP eliminado'}function table(h,rows){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${h.length}">Todavía no hay registros.</td></tr>`}</tbody></table></div>`}function standings(type){let a={};(type==='wdc'?db.drivers:db.teams).forEach(x=>a[x.id]={id:x.id,name:x.name,team:x.teamId,points:0,wins:0});db.results.forEach(r=>{if(r.type==='qualifying'||r.status==='DSQ'||(type==='wdc'&&r.eligibleWdc===false))return;let id=type==='wdc'?r.driverId:r.teamId;if(a[id]){a[id].points+=pts(r);if(r.position===1)a[id].wins++}});return Object.values(a).sort((x,y)=>y.points-x.points||y.wins-x.wins||x.name.localeCompare(y.name))}function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let m={dashboard:['Panel de control','Inicio'],drivers:['Gestión de parrilla','Pilotos'],teams:['Estructura','Escuderías'],results:['Sesiones por Gran Premio','Resultados'],calendar:['Temporada','Calendario'],standings:['Resultados acumulados','Clasificaciones'],history:['Registro de actividad','Historial'],admin:['Control del campeonato','Administración']};$('eyebrow').textContent=m[p][0];$('title').textContent=m[p][1];render(p)}$('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b)page(b.dataset.page)};function render(p){p=p||document.querySelector('nav .active')?.dataset.page||'dashboard';$('season').textContent=db.season?.name||'Temporada';({dashboard,drivers,teams,results:resultsPage,calendar,standings:showStandings,history,admin}[p]||dashboard)($('content'))}function stat(a,b,c){return `<div class="card"><div class="muted">${a}</div><div class="stat">${b}</div><div class="note">${c}</div></div>`}function dashboard(el){let w=standings('wdc'),c=standings('wcc'),last=[...db.results].sort((a,b)=>b.date.localeCompare(a.date))[0];el.innerHTML=`<div class="grid">${stat('PILOTOS',db.drivers.length,'En parrilla')}${stat('EQUIPOS',db.teams.length,'Constructores')}${stat('GRANDES PREMIOS',db.calendar.length,'En calendario')}${stat('REGISTROS',db.results.length,'Sesiones guardadas')}</div><section class="section"><div class="head"><h2>🏆 Campeonato de pilotos</h2><button class="btn2" onclick="page('standings')">Ver clasificación</button></div>${table(['Pos.','Piloto','Equipo actual','Puntos'],w.slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(tname(x.team))}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><div class="head"><h2>🏗️ Constructores</h2><button class="btn2" onclick="page('standings')">Ver clasificación</button></div>${table(['Pos.','Equipo','Puntos'],c.slice(0,5).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><div class="head"><h2>Último registro</h2><button onclick="page('results')">Ver resultados</button></div><div class="card">${last?`<b>${esc(gname(last.gpId))} · ${last.type==='race'?'Carrera':last.type==='sprint'?'Sprint':'Clasificación'}</b><p class="muted">${esc(dname(last.driverId))} · P${last.position||'—'}</p>`:'Aún no hay sesiones registradas. ¡A estrenar el campeonato! 🏁'}</div></section>`}function drivers(el){el.innerHTML=`<div class="head"><h2>Parrilla de pilotos</h2><button onclick="addDriver()">+ Añadir piloto</button></div>${table(['Piloto','Equipo','Número','Acciones'],db.drivers.map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(tname(d.teamId))}</td><td>${esc(d.number||'—')}</td><td><div class="rowactions"><button class="btn2 small" onclick="transfer('${d.id}')">Cambiar equipo</button><button class="danger small" onclick="delDriver('${d.id}')">Eliminar</button></div></td></tr>`).join(''))}`}function teams(el){el.innerHTML=`<div class="head"><h2>Escuderías participantes</h2><button onclick="addTeam()">+ Añadir escudería</button></div>${table(['Escudería','Pilotos actuales','Acciones'],db.teams.map(t=>`<tr><td><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${esc(t.color||'#e63946')};margin-right:8px"></span><b>${esc(t.name)}</b></td><td>${db.drivers.filter(d=>d.teamId===t.id).map(d=>esc(d.name)).join(', ')||'—'}</td><td><button class="danger small" onclick="delTeam('${t.id}')">Eliminar</button></td></tr>`).join(''))}`}function calendar(el){el.innerHTML=`<div class="head"><h2>Calendario de temporada</h2><button onclick="addGp()">+ Añadir GP</button></div>${table(['Ronda','Gran Premio','Sprint','Estado','Acciones'],db.calendar.map((g,i)=>`<tr><td>${i+1}</td><td><b>${esc(g.name)}</b></td><td>${g.sprint?'<span class="tag good">Sí</span>':'No'}</td><td>${db.results.some(r=>r.gpId===g.id)?'Con resultados':'Pendiente'}</td><td><div class="rowactions"><button class="btn2 small" onclick="newResult('${g.id}')">Registrar</button><button class="danger small" onclick="delGp('${g.id}')">Eliminar</button></div></td></tr>`).join(''))}`}function showStandings(el){let w=standings('wdc'),c=standings('wcc');el.innerHTML=`<section class="section"><h2>🏆 WDC · Pilotos</h2>${table(['Pos.','Piloto','Equipo actual','Victorias','Puntos'],w.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${esc(tname(x.team))}</td><td>${x.wins}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><section class="section"><h2>🏗️ WCC · Constructores</h2>${table(['Pos.','Equipo','Victorias','Puntos'],c.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${x.wins}</td><td class="points">${x.points}</td></tr>`).join(''))}</section><p class="muted">GP: 25–18–15–12–10–8–6–4–2–1 · Sprint: 8–7–6–5–4–3–2–1 · Sin punto por vuelta rápida.</p>`}function history(el){let a=[...db.results].sort((x,y)=>y.date.localeCompare(x.date));el.innerHTML=`<div class="head"><h2>Historial de sesiones</h2><button onclick="page('results')">Ver resultados por GP</button></div>${table(['Fecha','GP','Sesión','Piloto','Pos.','Puntos','Estado'],a.map(r=>`<tr><td>${new Date(r.date).toLocaleDateString('es-DO')}</td><td>${esc(gname(r.gpId))}</td><td>${r.type==='race'?'Carrera':r.type==='sprint'?'Sprint':'Clasificación'}</td><td>${esc(dname(r.driverId))}</td><td>${r.position||'—'}</td><td class="points">${pts(r)}</td><td>${r.status||'FIN'}</td></tr>`).join(''))}`}
function resultsPage(el){let gps=db.calendar.filter(g=>resultsGp==='all'||g.id===resultsGp);if(resultsGp!=='all'&&!db.calendar.some(g=>g.id===resultsGp))resultsGp='all';let g=db.calendar.find(x=>x.id===resultsGp);let allowed=[{value:'qualifying',label:'Clasificación'},{value:'sprint',label:'Sprint'},{value:'race',label:'Carrera'}].filter(x=>x.value!=='sprint'||!g||g.sprint);if(!allowed.some(x=>x.value===resultsType))resultsType='race';let arr=db.results.filter(r=>(resultsGp==='all'||r.gpId===resultsGp)&&r.type===resultsType).sort((a,b)=>(a.position||99)-(b.position||99));let gpButtons=`<div class="toolbar" style="display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin:12px 0"><button class="${resultsGp==='all'?'':'btn2'} small" onclick="setResultsGp('all')">Todos</button>${db.calendar.map(x=>`<button class="${resultsGp===x.id?'':'btn2'} small" onclick="setResultsGp('${x.id}')">${esc(x.name)}</button>`).join('')}</div>`;let tabs=allowed.map(x=>`<button class="${resultsType===x.value?'':'btn2'}" onclick="setResultsType('${x.value}')">${x.label}</button>`).join('');let rows=arr.map(r=>{let gain=r.type==='race'&&r.gridPosition?Number(r.gridPosition)-Number(r.position):null;let move=gain===null?'—':gain>0?`<span class="good">↑ ${gain}</span>`:gain<0?`<span style="color:#ff929b">↓ ${Math.abs(gain)}</span>`:'0';return `<tr><td>${r.position||'—'}</td><td><b>${esc(dname(r.driverId))}</b></td><td>${esc(tname(r.teamId))}</td>${r.type==='race'?`<td>${r.gridPosition||'—'}</td><td>${move}</td><td>${esc(r.leaderGap||'—')}</td>`:`<td>${esc(r.time||'—')}</td>`}<td class="points">${pts(r)}</td><td>${r.status||'FIN'}</td><td><div class="rowactions"><button class="btn2 small" onclick="editResult('${r.id}')">Editar</button><button class="danger small" onclick="delResult('${r.id}')">Borrar</button></div></td></tr>`}).join('');let headers=resultsType==='race'?['Final','Piloto','Escudería','Salida','Posiciones','Gap al líder','Pts.','Estado','Acciones']:['Pos.','Piloto','Escudería','Tiempo','Pts.','Estado','Acciones'];el.innerHTML=`<div class="head"><div><h2>Resultados por Gran Premio</h2><p class="note">Selecciona un GP y después la sesión que quieras consultar o editar.</p></div><button onclick="newResult('${resultsGp==='all'?'':resultsGp}')">+ Añadir resultado</button></div>${gpButtons}<div class="actions" style="justify-content:flex-start;margin:10px 0 14px">${tabs}</div>${table(headers,rows||'')}<p class="note">La columna «Posiciones» se calcula comparando la salida con la llegada. El gap al líder lo escribes tú. Los resultados guardan la escudería con la que se consiguieron.</p>`}
function setResultsGp(id){resultsGp=id;render('results')}function setResultsType(type){resultsType=type;render('results')}
function admin(el){el.innerHTML=`<div class="grid">${stat('TEMPORADA',esc(db.season.name),'En curso')}${stat('TRANSFERENCIAS',db.transfers.length,'Cambios permanentes')}${stat('ARCHIVOS',db.archives.length,'Temporadas anteriores')}${stat('BACKUP','JSON','Exportar / importar')}</div><div class="card section"><h2>Temporada</h2><div class="actions"><button class="btn2" onclick="renameSeason()">Renombrar</button><button class="btn2" onclick="archiveSeason()">Archivar y empezar otra</button><button class="danger" onclick="resetSeason()">Reiniciar campeonato</button></div><div class="notice">Los datos se guardan en este navegador. Si borras sus datos, podrías perder el campeonato. Exporta backups con frecuencia.</div></div><div class="card section"><h2>Copia de seguridad</h2><p class="muted">Incluye pilotos, equipos, calendario, resultados, transferencias y temporadas archivadas.</p><div class="actions"><button onclick="backup()">⬇ Exportar backup</button><label class="btn2" style="cursor:pointer">⬆ Importar backup<input type="file" accept=".json,application/json" hidden onchange="restore(event)"></label></div></div><div class="card section"><h2>Reglas de puntuación</h2><p>GP: <b>25–18–15–12–10–8–6–4–2–1</b></p><p>Sprint: <b>8–7–6–5–4–3–2–1</b></p><p>Clasificación y vuelta rápida: <b>0 puntos</b></p></div><div class="card section"><h2>Historial de transferencias</h2>${db.transfers.length?table(['Piloto','Equipo anterior','Nuevo equipo','Fecha'],db.transfers.map(t=>`<tr><td>${esc(t.driver)}</td><td>${esc(t.from)}</td><td>${esc(t.to)}</td><td>${new Date(t.date).toLocaleDateString('es-DO')}</td></tr>`).join('')):'<p class="muted">No hay transferencias.</p>'}</div><div class="card section"><h2>Temporadas archivadas</h2>${db.archives.map(a=>`<p><b>${esc(a.season.name)}</b> · ${a.results.length} registros · <button class="btn2 small" onclick="archiveSummary('${a.id}')">Ver resumen</button></p>`).join('')||'<p class="muted">No hay temporadas anteriores.</p>'}</div>`}
function openModal(head,body,fn,txt='Guardar'){$('modal').innerHTML=`<h2>${head}</h2>${body}<div class="modalfoot"><button class="btn2" onclick="closeModal()">Cancelar</button><button id="submit">${txt}</button></div>`;$('modalbg').classList.add('show');document.getElementById('submit').onclick=fn}function closeModal(){$('modalbg').classList.remove('show')}function field(id,label,type='text',value=''){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}function sel(id,label,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${esc(o.value)}">${esc(o.label)}</option>`).join('')}</select></div>`}function addTeam(){openModal('Añadir escudería',field('name','Nombre de la escudería')+`<div class="field"><label>Color de la escudería</label><input id="teamColor" type="color" value="#e63946" style="height:44px;padding:4px"></div>`,()=>{let n=$('name').value.trim();if(!n)return alert('Escribe el nombre.');db.teams.push({id:uid(),name:n,color:$('teamColor').value});closeModal();save()})}function addDriver(){if(!db.teams.length)return alert('Primero añade un equipo.');openModal('Añadir piloto',field('name','Nombre del piloto')+`<div class="formgrid">${sel('team','Equipo',db.teams.map(t=>({value:t.id,label:t.name}))) }${field('number','Número','number')}</div>`,()=>{if(!$('name').value.trim())return alert('Escribe el nombre.');db.drivers.push({id:uid(),name:$('name').value.trim(),teamId:$('team').value,number:document.getElementById('number').value});closeModal();save()})}function addGp(){openModal('Añadir Gran Premio',field('name','Nombre del GP')+`<div class="field"><label><input id="sprint" type="checkbox" style="width:auto"> Este GP tiene Sprint</label></div>`,()=>{if(!$('name').value.trim())return alert('Escribe el nombre.');db.calendar.push({id:uid(),name:$('name').value.trim(),sprint:$('sprint').checked});closeModal();save()})}function transfer(id){let d=db.drivers.find(x=>x.id===id),opts=db.teams.filter(t=>t.id!==d.teamId);if(!opts.length)return alert('Añade otro equipo primero.');openModal('Cambio permanente de equipo',`<p>${esc(d.name)} empezará desde cero en el WDC. Los resultados anteriores siguen sumando al WCC de su escudería original. El piloto empieza desde cero en el WDC; los resultados nuevos sumarán a su nueva escudería.</p>${sel('newTeam','Nuevo equipo',opts.map(t=>({value:t.id,label:t.name})))}`,()=>{let old=d.teamId,nt=$('newTeam').value;if(!nt)return;db.results.filter(r=>r.driverId===id).forEach(r=>r.eligibleWdc=false);db.transfers.push({id:uid(),driver:d.name,from:tname(old),to:tname(nt),date:new Date().toISOString()});d.teamId=nt;closeModal();save()})}function resultForm(r=null,gp=''){let selectedGp=r?.gpId||gp||db.calendar[0]?.id||'',selectedType=r?.type||'race';let gpOpts=db.calendar.map(g=>({value:g.id,label:g.name}));let body=`${sel('gp','Gran Premio',gpOpts)}${sel('type','Sesión',[{value:'qualifying',label:'Clasificación'},{value:'sprint',label:'Sprint'},{value:'race',label:'Carrera'}])}${sel('driver','Piloto',db.drivers.map(d=>({value:d.id,label:d.name+' · '+tname(d.teamId)})))}<div class="formgrid">${field('position','Posición final','number',r?.position??'1')}${sel('status','Estado',[{value:'FIN',label:'Finalizó'},{value:'DNF',label:'DNF'},{value:'DNS',label:'DNS'},{value:'DSQ',label:'DSQ'}])}</div><div id="raceFields" class="formgrid">${field('gridPosition','Posición de salida','number',r?.gridPosition??'1')}${field('leaderGap','Gap al líder (ej. +5.320s)','text',r?.leaderGap??'')}</div><div id="timeField">${field('time','Tiempo (clasificación / Sprint)','text',r?.time??'')}</div><p class="note">La posición final se introduce manualmente. En carrera, la app calcula las posiciones ganadas o perdidas comparando salida y llegada. No hay penalizaciones.</p>`;openModal(r?'Editar resultado':'Registrar resultado',body,()=>{let g=db.calendar.find(x=>x.id===$('gp').value),ty=$('type').value,pos=Number($('position').value)||0,st=$('status').value;if(!g)return alert('Selecciona un GP.');if(ty==='sprint'&&!g.sprint)return alert('Este GP no tiene Sprint configurada.');if(!db.drivers.some(d=>d.id===$('driver').value))return alert('Selecciona un piloto.');if(st!=='DNS'&&st!=='DSQ'&&(!pos||pos<1))return alert('Indica la posición final.');let d=db.drivers.find(x=>x.id===$('driver').value);if(r){let oldDriver=r.driverId;r.gpId=g.id;r.type=ty;r.driverId=d.id;if(oldDriver!==d.id){r.teamId=d.teamId;r.eligibleWdc=true}r.position=pos;r.status=st;r.gridPosition=ty==='race'?(Number($('gridPosition').value)||0):null;r.leaderGap=ty==='race'?$('leaderGap').value.trim():'';r.time=ty!=='race'?$('time').value.trim():''}else{db.results.push({id:uid(),gpId:g.id,type:ty,driverId:d.id,teamId:d.teamId,position:pos,status:st,gridPosition:ty==='race'?(Number($('gridPosition').value)||0):null,leaderGap:ty==='race'?$('leaderGap').value.trim():'',time:ty!=='race'?$('time').value.trim():'',eligibleWdc:true,date:new Date().toISOString()})}closeModal();save()});$('gp').value=selectedGp;$('type').value=selectedType;$('driver').value=r?.driverId||db.drivers[0]?.id||'';let sync=()=>{let ty=$('type').value;$('raceFields').style.display=ty==='race'?'grid':'none';$('timeField').style.display=ty==='race'?'none':'block';};$('type').onchange=sync;sync()}
function newResult(gp=''){if(!db.calendar.length||!db.drivers.length)return alert('Añade primero escuderías, pilotos y calendario.');resultForm(null,gp)}function editResult(id){let r=db.results.find(x=>x.id===id);if(r)resultForm(r)}
function delDriver(id){if(!confirm('¿Eliminar este piloto? Los resultados históricos se conservan.'))return;db.drivers=db.drivers.filter(x=>x.id!==id);save()}function delTeam(id){if(db.drivers.some(d=>d.teamId===id))return alert('Mueve o elimina los pilotos de este equipo primero.');if(confirm('¿Eliminar equipo? Los resultados históricos se conservan.')){db.teams=db.teams.filter(t=>t.id!==id);save()}}function delGp(id){if(confirm('¿Eliminar GP? Sus resultados históricos permanecerán.')){db.calendar=db.calendar.filter(g=>g.id!==id);save()}}function delResult(id){if(confirm('¿Borrar este registro?')){db.results=db.results.filter(r=>r.id!==id);save()}}function renameSeason(){openModal('Renombrar temporada',field('name','Nombre', 'text',db.season.name),()=>{if($('name').value.trim()){db.season.name=$('name').value.trim();closeModal();save()}})}function resetSeason(){if(confirm('¿Reiniciar campeonato? Se borrarán pilotos, equipos, calendario, resultados y transferencias de esta temporada. Exporta un backup antes si lo necesitas.')){db=fresh();save()}}function archiveSeason(){if(!confirm('¿Archivar esta temporada y empezar una nueva vacía?'))return;db.archives.push({id:uid(),season:db.season,drivers:db.drivers,teams:db.teams,calendar:db.calendar,results:db.results,transfers:db.transfers,archivedAt:new Date().toISOString()});db.season={id:uid(),name:'Temporada '+(new Date().getFullYear())};db.drivers=[];db.teams=[];db.calendar=[];db.results=[];db.transfers=[];save()}function archiveSummary(id){let a=db.archives.find(x=>x.id===id);alert(`${a.season.name}\nPilotos: ${a.drivers.length}\nEquipos: ${a.teams.length}\nGP: ${a.calendar.length}\nRegistros: ${a.results.length}`)}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-championship-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.season||!Array.isArray(x.drivers)||!Array.isArray(x.results))throw Error();if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){db=x;save();alert('Backup importado correctamente.')}}catch{alert('El archivo no parece ser un backup válido de My Championship.')}};r.readAsText(f)}
db.results.forEach(r=>{if(!r.teamId){r.teamId=db.drivers.find(d=>d.id===r.driverId)?.teamId||null}if(r.eligibleWdc===undefined)r.eligibleWdc=true;if(!r.status)r.status='FIN'});
render();
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(err=>console.warn('No se pudo activar el modo sin conexión:',err)));}</script></body></html>
